{% extends "base.html" %}
{% block title %}Your Bookmarks — {{ app_name }}{% endblock %}
{% block content %}
<section class="news-section" style="padding-top:3rem;">
  <div class="container">
    <div class="section-heading with-action">
      <div>
        <h2><i class='bx bxs-bookmark' style="color:var(--color-primary);"></i> Your Bookmarks</h2>
        <p>Articles you've saved to read later</p>
      </div>
    </div>

    <div class="row g-4" id="bookmarksGrid"></div>

    <div class="text-center py-5 d-none" id="emptyBookmarksMsg">
      <i class='bx bx-bookmark-alt-minus' style="font-size:2.5rem;color:var(--color-muted);"></i>
      <p class="mt-2 mb-0" style="color:var(--color-muted);">No bookmarks yet — save articles from the home page to see them here.</p>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/bookmarks.js') }}"></script>
{% endblock %}
