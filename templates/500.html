{% extends "base.html" %}
{% block title %}Server Error — {{ app_name }}{% endblock %}
{% block content %}
<section class="error-page">
  <div class="container text-center">
    <i class='bx bx-error error-icon'></i>
    <h1>500</h1>

  </div>
</section>
{% endblock %}
