{% extends "base.html" %}
{% block title %}Sign In — {{ app_name }}{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="auth-card glass-card">
      <div class="auth-icon"><i class='bx bx-log-in-circle'></i></div>
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Sign in to continue.</p>

      <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Username or Email</label>
          <input type="text" name="identifier" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" name="remember_me" class="form-check-input" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember me for 30 days</label>
        </div>
        <button type="submit" class="btn btn-primary-gradient w-100"><i class='bx bx-log-in-circle'></i> Sign In</button>
      </form>

      <p class="auth-footer-link">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
    </div>
  </div>
</section>
{% endblock %}
